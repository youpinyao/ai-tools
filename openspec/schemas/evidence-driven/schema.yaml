name: evidence-driven
version: 1
description: 带验证环节的默认 OpenSpec 工作流——提案 → 规范 → 设计 → 任务 → 验证
artifacts:
  - id: proposal
    generates: proposal.md
    description: 说明变更内容的初始提案文档
    template: proposal.md
    instruction: |
      创建提案文档，说明为什么需要此项变更。

      Superpowers 对接（薄适配）：撰写或覆盖本提案前 MUST 遵循 `brainstorming` 前门——
      先澄清意图、对比至少两个可行方案并获用户批准后再写入。
      若用户已在同一会话明确选定方案，MAY 将既有结论视为已批准，但 MUST 在动笔前
      简短复述范围供确认；用户反对时 MUST 停止并回到澄清。纯只读探索不强制写提案。

      文档章节：
      - **背景与动机**：用 1～2 句话说明问题或机会。本变更解决什么问题？为什么现在需要变更？
      - **变更内容**：以项目符号列出变更。明确说明新增、修改或移除的能力。破坏性变更须标记为 **BREAKING**。
      - **能力**：明确将创建或修改哪些规范：
        - **新增能力**：列出本次引入的能力。每项能力对应一个新的 `specs/<名称>/spec.md`。名称使用 kebab-case（例如 `user-auth`、`data-export`）。
        - **修改能力**：列出需求（REQUIREMENTS）发生变化的现有能力。仅在规范层行为变化时列出，不包括单纯的实现细节变化。每项能力都需要一个增量规范（delta spec）文件。检查 `openspec/specs/` 中已有的规范名称；没有需求变化时留空。
      - **影响**：受影响的代码、API、依赖或系统。

      重要：能力章节至关重要，它建立提案与规范阶段之间的约定。
      填写前先调研已有规范。此处列出的每项能力都必须有对应的规范文件。

      每项变更必须声明至少一项能力（新增或修改），或明确选择跳过规范：
      若没有任何规范增量，`openspec validate` 会拒绝，除非该 change 的
      `.openspec.yaml` 设置了 `skip_specs: true`。仅在无规范层行为变化时
      使用（纯重构、工具链、文档等）——规范描述行为，行为不变则规范也不应变。
      不要为了通过校验而捏造需求。

      内容保持简洁（1～2 页），重点说明“为什么”，而不是“如何实现”；
      实现细节应写入 design.md。

      提案是后续工作的基础，规范、设计和任务都建立在提案之上。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 变更的详细规范
    template: spec.md
    instruction: |
      创建规范文件，定义系统应该做什么。

      为提案“能力”章节中列出的每项能力创建一个规范文件。
      - 新增能力：使用提案中完全一致的 kebab-case 名称（`specs/<capability>/spec.md`）。
      - 修改能力：在 `specs/<capability>/spec.md` 创建增量规范时，使用 `openspec/specs/<capability>/` 中已有的规范目录名称。

      除非 change 的 `.openspec.yaml` 设置了 `skip_specs: true`（无规范层行为变化），
      否则必须至少有一个规范文件——`openspec validate` 会拒绝零增量变更。
      若提案未列出任何能力且未设置 `skip_specs`，先回到提案修订。

      增量操作（使用 ## 标题）：
      - **ADDED Requirements**：新增能力
      - **MODIFIED Requirements**：变更的行为，必须包含更新后的完整内容
      - **REMOVED Requirements**：废弃的功能，必须包含 **Reason** 和 **Migration**
      - **RENAMED Requirements**：仅用于名称变更，使用 FROM:/TO: 格式

      格式要求：
      - 每项需求使用 `### Requirement: <名称>`，后接需求说明
      - 规范性需求使用 SHALL/MUST，避免使用 should/may
      - 每个场景使用 `#### Scenario: <名称>`，并采用 WHEN/THEN 格式
      - **关键要求**：场景标题必须恰好使用 4 个井号（`####`）。使用 3 个井号或项目符号会导致静默失败。
      - 每项需求必须至少包含一个场景。

      仅新增能力：增量规范开头须有 `## Purpose` 小节——一两句话说明该能力用途
      （建议 50 字以上，否则 `openspec validate --strict` 可能判定过短）。
      归档时会写入新建的 main spec；缺失时 main spec 会留下
      `TBD ... Update Purpose after archive` 占位。不要给“修改已有能力”的
      增量规范加 `## Purpose`——该能力已有 Purpose，增量中的会被忽略。
      若要改已有能力的 Purpose（含残留 TBD），直接编辑
      `openspec/specs/<capability>/spec.md`。

      MODIFIED 需求处理流程：
      1. 在 `openspec/specs/<capability>/spec.md` 中找到现有需求
      2. 复制完整的需求块（从 `### Requirement:` 开始，包含其全部场景）
      3. 粘贴到 `## MODIFIED Requirements` 下，并根据新行为进行修改
      4. 确保标题文本完全匹配（忽略空白差异）

      常见问题：MODIFIED 只包含部分内容会在归档时丢失细节。
      如果只是增加新关注点而未改变现有行为，应使用 ADDED。

      示例（新增能力，故以 `## Purpose` 开头）：
      ```
      ## Purpose

      允许用户以可移植格式将产品中的数据导出。

      ## ADDED Requirements

      ### Requirement: 用户可以导出数据
      系统 SHALL 允许用户以 CSV 格式导出其数据。

      #### Scenario: 成功导出
      - **WHEN** 用户点击“导出”按钮
      - **THEN** 系统下载包含全部用户数据的 CSV 文件

      ## REMOVED Requirements

      ### Requirement: 旧版导出
      **Reason**: 已由新版导出系统取代
      **Migration**: 使用新的导出端点 `/api/v2/export`
      ```

      规范应具备可测试性，每个场景都可能成为一个测试用例。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 包含实现细节的技术设计文档
    template: design.md
    instruction: |
      创建设计文档，说明如何实现此项变更。

      Superpowers 对接（薄适配）：写设计前 MUST 遵循 `brainstorming` 前门——
      呈现设计要点并获得用户批准后再写入或覆盖 design.md。
      若用户已在同一会话明确选定方案，MAY 将既有探索结论视为已批准设计摘要，
      但 MUST 在动笔前简短复述范围供确认；用户反对时 MUST 停止并回到澄清。
      不强制另写 `docs/superpowers/specs/`；OpenSpec change 制品即为本仓库设计真源。
      未获用户要求时 MUST NOT 自动 git commit。

      何时需要 design.md（至少符合一项时才创建）：
      - 跨多个服务或模块的横切变更，或者引入新的架构模式
      - 引入新的外部依赖，或者数据模型发生重大变化
      - 存在安全、性能或迁移方面的复杂性
      - 存在适合在编码前通过技术决策消除的歧义

      文档章节：
      - **背景**：相关背景、当前状态、约束和利益相关方
      - **目标 / 非目标**：本设计要达成的目标，以及明确排除的内容
      - **设计决策**：关键技术选择及其理由（为什么选择 X 而不是 Y？）。每项决策都应包含考虑过的替代方案。
      - **风险 / 权衡**：已知限制和潜在问题。格式：[风险] → 缓解措施
      - **迁移计划**：部署步骤和回滚策略（如适用）
      - **待解决问题**：尚未作出的决策或需要解决的未知事项

      重点描述架构和实现思路，不要逐行描述实现。
      变更动机以提案为依据，需求以规范为依据。

      优秀的设计文档会说明技术决策背后的“为什么”。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 包含可跟踪任务的实现清单
    template: tasks.md
    instruction: |
      创建任务清单，将实现工作拆分为可执行的任务。

      **重要：必须严格遵循下方模板。** apply 阶段通过解析复选框格式跟踪进度。
      未使用 `- [ ]` 格式的任务不会被跟踪。

      Superpowers 对接（薄适配）：生成或大幅修订 tasks 时 MUST 对齐 `writing-plans`
      粒度——先给出将触及的文件/模块地图（可写在 design 或 tasks 序言）；
      每项任务对应可独立验证的交付物，边界清晰到任务级审查可批准一项而拒绝邻项；
      行为变更类任务 MUST 写明如何验证（测试或等价检查）。
      禁止仅用含糊的「实现某某模块」作为唯一描述。未获用户要求时 MUST NOT 自动 commit。

      编写准则：
      - 在带编号的 ## 标题下对相关任务分组
      - 每项任务必须使用复选框：`- [ ] X.Y 任务说明`
      - 任务粒度应足够小，便于在一次实现推进中独立完成并勾选
      - 按依赖关系排列任务，优先列出必须先完成的任务
      - 每项任务写清可验证完成标准，避免含糊的“搞定某某模块”

      示例：
      ```
      ## 文件 / 模块地图

      - `src/export/`：新建导出模块

      ## 1. 准备工作

      - [ ] 1.1 创建新的模块结构（交付：目录与入口文件存在；验证：路径可列出）
      - [ ] 1.2 向 package.json 添加依赖（交付：依赖声明；验证：安装命令成功）

      ## 2. 核心实现

      - [ ] 2.1 实现数据导出函数（交付：可调用导出 API；验证：单元测试先红后绿或约定等价检查）
      - [ ] 2.2 添加 CSV 格式化工具（交付：CSV 序列化；验证：针对格式用例的测试通过）
      ```

      要构建什么以规范为依据，如何构建以设计为依据。
      每项任务都应可验证，以便明确判断任务是否完成。
    requires:
      - specs
      - design

  - id: verification
    generates: verification.md
    description: 验证计划与实现证据
    template: verification.md
    instruction: |
      创建验证计划，定义如何验证实现。

      将需求和场景映射到适用的自动化或人工检查。
      使用已从仓库确认的真实命令，不要编造命令。
      规划阶段将检查标记为待执行，不得捏造结果。
      实现后记录实际执行的命令、结果、跳过的检查和剩余风险。
      声称检查「通过」或「全部完成」时 MUST 遵循 `verification-before-completion`：
      本回合实际执行适用命令并阅读输出；禁止仅用旧会话口头记忆作为唯一证据。

      必须包含「代码审查（归档硬门禁）」节：独立 verify Agent 编排 Code Review
      （对应 superpowers requesting-code-review）。规划阶段审查轨状态为待执行，禁止捏造审查结果。
      Superpowers 对接（薄适配）：verify 执行时，在 Task 可用前提下 MUST 派发 Code Review；
      Task 不可用时回退并注明。轨不适用时 MUST 标明原因，不得假造结果。
      硬规则：判定「不适用」前 MUST 检查脏工作区（`git status` / `git diff HEAD` /
      staged）；存在未提交变更时 MUST 纳入 Diff 范围审查或阻塞并要求明确范围；
      **禁止**仅因 BASE==HEAD 空 commit diff 将审查标为不适用并旁路归档硬门禁。
      门禁档位：Critical 阻塞；Important 须修复或书面技术反驳并接受；
      Minor 记入剩余风险、不单独阻塞。Finding 处置遵循 receiving-code-review。


      独立验证结论应留给未参与实现此项变更的 Agent 填写。
      模板须说明：优先由 /opsx:apply 在证据门禁完成后 Task 派发独立子 Agent 跑 /opsx:verify；
      亦可由用户新开会话手动 verify。实现 Agent 不得自填「独立验证结论」。

      Superpowers 对接（薄适配）：当独立验证结论为「验证结论：通过」后，verify MUST
      提示 `finishing-a-development-branch` 收尾选项（合并 / PR / 保留 / 清理等，按环境裁剪），
      仅在用户选择后执行；规划阶段只写明挂点，不得伪造收尾结果。
      finishing 不在 apply 中执行；archive 门禁通过后若尚未集成，MUST 再次提示该菜单。
    requires:
      - tasks

apply:
  requires: [verification]
  tracks: tasks.md
  instruction: |
    阅读上下文文件后，逐项完成待办任务，完成后立即勾选。
    执行 verification.md 中定义的检查，并记录实际证据。
    不要填写独立验证结论，不要自填代码审查为通过。
    实现证据门禁完成后：优先用 Task 派发独立子 Agent 执行 /opsx:verify
    （隔离上下文，不继承本会话实现历史）；子 Agent 须编排 Code Review
    并写入 verification.md 后再下「独立验证结论」。
    若无法派发，再提示用户新开会话手动 /opsx:verify。
    遇到阻塞或需要澄清时暂停。
