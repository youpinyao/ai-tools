name: evidence-driven
version: 1
description: 带验证环节的默认 OpenSpec 工作流——提案 → 规范 → 设计 → 任务 → 验证
artifacts:
  - id: proposal
    generates: proposal.md
    description: 概述变更的初始提案文档
    template: proposal.md
    instruction: |
      创建提案文档，明确为什么需要此项变更。

      章节：
      - **为什么**：用 1～2 句话说明问题或机会。本变更解决什么问题？为什么是现在？
      - **变更内容**：以项目符号列出变更。具体说明新增能力、修改或移除。用 **BREAKING** 标记破坏性变更。
      - **能力**：明确将创建或修改哪些规范：
        - **新增能力**：列出本次引入的能力。每项能力都会成为新的 `specs/<capability-path>/spec.md`。对提案中新引入的路径段使用 kebab-case（例如 `user-auth` 或 `identity/user-auth`），并遵循项目既有的规范组织方式。
        - **修改能力**：列出需求（REQUIREMENTS）发生变化的现有能力。仅在规范层行为发生变化时列出（而非只改实现细节）。每项能力都需要一个增量规范文件。使用 `openspec/specs/` 下准确的现有路径。若需求没有变化则留空。
      - **影响**：受影响的代码、API、依赖或系统。

      重要：能力章节至关重要。它建立提案与规范阶段之间的契约。
      填写前先调研现有规范。此处列出的每项能力都需要对应的规范文件。

      每项变更必须声明至少一项能力（新增或修改），或明确选择跳过规范：
      若变更的 `.openspec.yaml` 未设置 `skip_specs: true`，`openspec validate`
      会拒绝零增量的变更。仅在规范层行为没有变化（纯重构、工具链、文档）时
      使用 `skip_specs: true`——规范描述行为，因此行为不变时规范也不应变化。
      不要为了通过校验而捏造需求。

      内容保持简洁（1～2 页）。重点说明“为什么”，而不是“如何实现”——
      实现细节应写入 design.md。

      这是后续工作的基础——规范、设计和任务都建立在提案之上。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 变更的详细规范
    template: spec.md
    instruction: |
      创建规范文件，定义系统应该做什么。

      规范是行为契约，而不是实现计划。

      适合写入规范的内容：
      - 用户或下游系统所依赖的可观察行为
      - 输入、输出和错误条件
      - 外部约束（安全、隐私、可靠性、兼容性）
      - 可以测试或明确验证的场景

      规范中应避免：
      - 内部类名或函数名
      - 库或框架的选择
      - 逐步实现细节
      - 详细执行计划（这些内容属于 design.md 或 tasks.md）

      快速判断：如果实现可以改变而外部可见行为不变，该内容通常不属于规范。

      为提案“能力”章节中列出的每项能力创建一个规范文件。
      `<capability-path>` 是相对于 `specs/` 的规范目录（例如
      `user-auth` 或 `identity/user-auth`）。保留完整路径：
      - 新增能力：使用提案中的准确路径 `specs/<capability-path>/spec.md`。提案中新引入的任何路径段都必须使用 kebab-case。遵循项目既有组织方式；若项目使用扁平布局，不要新增领域层级。
      - 修改能力：在 `specs/<capability-path>/spec.md` 创建增量规范时，使用 `openspec/specs/<capability-path>/` 下准确的现有路径。不要移动或重命名该能力。

      除非变更的 `.openspec.yaml` 设置了 `skip_specs: true`（没有规范层行为变化），
      否则必须至少有一个规范文件——`openspec validate` 会拒绝没有该标记的
      零增量变更。若提案未列出任何能力且未设置 `skip_specs`，先回到提案修订。

      增量操作（使用 ## 标题）：
      - **ADDED Requirements**：新增能力
      - **MODIFIED Requirements**：变更的行为——必须包含更新后的完整内容
      - **REMOVED Requirements**：废弃的功能——必须包含 **Reason** 和 **Migration**
      - **RENAMED Requirements**：仅用于名称变更——使用 FROM:/TO: 格式

      格式要求：
      - 每项需求使用 `### Requirement: <名称>`，后接需求说明
      - 规范性需求使用 SHALL/MUST（避免 should/may）
      - 每个场景使用 `#### Scenario: <名称>`，并采用 WHEN/THEN 格式
      - **关键要求**：场景标题必须恰好使用 4 个井号（`####`）。使用 3 个井号或项目符号会静默失败。
      - 每项需求必须至少包含一个场景。

      仅新增能力：增量规范开头须有 `## Purpose` 小节——用一两句话
      （50 个以上字符，否则 `openspec validate --strict` 会报告过短）说明该能力的用途。
      归档时会将它复制到新建的主规范；若缺失，新主规范会留下
      `TBD ... Update Purpose after archive` 占位符，需要手动补充。
      不要给现有能力的增量添加 `## Purpose`——该规范已有 Purpose，增量中的内容会被忽略。
      若要修改现有能力的 Purpose（包括遗留的 `TBD` 占位符），请直接编辑
      `openspec/specs/<capability-path>/spec.md`。

      MODIFIED 需求处理流程：
      1. 在 `openspec/specs/<capability-path>/spec.md` 中找到现有需求
      2. 复制完整的需求块（从 `### Requirement:` 开始，包含全部场景）
      3. 粘贴到 `## MODIFIED Requirements` 下，并根据新行为进行修改
      4. 确保标题文本完全匹配（忽略空白差异）

      常见问题：MODIFIED 只包含部分内容会在归档时丢失细节。
      如果只是增加新的关注点而没有改变现有行为，应使用 ADDED。

      示例（新增能力，因此以 `## Purpose` 开头）：
      ```
      ## Purpose

      让用户能够以可移植格式将自己的数据导出产品。

      ## ADDED Requirements

      ### Requirement: 用户可以导出数据
      系统 SHALL 允许用户以 CSV 格式导出其数据。

      #### Scenario: 成功导出
      - **WHEN** 用户点击“导出”按钮
      - **THEN** 系统下载包含全部用户数据的 CSV 文件

      ## REMOVED Requirements

      ### Requirement: 旧版导出
      **Reason**: 已由新版导出系统取代
      **Migration**: 使用新的导出端点 `/api/v2/export`
      ```

      规范应可测试——每个场景都是潜在的测试用例。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 包含实现细节的技术设计文档
    template: design.md
    instruction: |
      创建设计文档，说明如何实现此项变更。

      何时包含 design.md（至少符合一项时才创建）：
      - 跨多个服务或模块的横切变更，或者引入新的架构模式
      - 引入新的外部依赖，或者数据模型发生重大变化
      - 存在安全、性能或迁移方面的复杂性
      - 存在适合在编码前通过技术决策消除的歧义

      章节：
      - **背景**：仅包含解释方案所需的当前状态和约束。引用提案中的动机，不要重复叙述（例如“见 proposal.md——为什么”）。
      - **目标 / 非目标**：本设计要达成的目标以及明确排除的内容。不要重复提案范围——只添加设计层边界。
      - **设计决策**：关键技术选择及理由（为什么选择 X 而不是 Y？）。每项决策都应包含考虑过的替代方案。
      - **风险 / 权衡**：已知限制和潜在问题。格式：[风险] → 缓解措施
      - **迁移计划**：部署步骤和回滚策略（如适用）
      - **待解决问题**：可以安全地稍后回答，且不会改变规范、方案或任务拆分的未知事项。若无则省略。

      待解决问题只用于真正可以推迟的未知事项，而不是被跳过的决策。
      如果某个问题会改变规范、选定方案或任务拆分，现在就解决它——
      应询问用户，而不是猜测。

      重点描述架构和方案，不要逐行描述实现。
      提案说明为什么和做什么；设计说明如何做。动机应引用提案，
      需求在规范写成后应引用规范——如果某节只会重复它们，就指向相应文档。

      优秀的设计文档会说明技术决策背后的“为什么”。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 包含可跟踪任务的实现清单
    template: tasks.md
    instruction: |
      创建任务清单，将实现工作拆分为可执行任务。

      编写任务前，检查 design.md 中的待解决问题。如果其中任何问题会改变
      要构建的内容，先与用户一起解决——不要把未明说的假设写入任务清单。

      **重要：必须严格遵循下方模板。** apply 阶段通过解析复选框格式跟踪进度。
      未使用 `- [ ]` 格式的任务不会被跟踪。

      准则：
      - 在带编号的 ## 标题下对相关任务分组
      - 每项任务必须使用复选框：`- [ ] X.Y 任务说明`
      - 任务应足够小，可以在一个会话中完成
      - 按依赖关系排列任务（哪些必须先完成？）

      示例：
      ```
      ## 1. 准备工作

      - [ ] 1.1 创建新的模块结构
      - [ ] 1.2 向 package.json 添加依赖

      ## 2. 核心实现

      - [ ] 2.1 实现数据导出函数
      - [ ] 2.2 添加 CSV 格式化工具
      ```

      要构建什么以规范为依据，如何构建以设计为依据。
      每项任务都应可验证——能够明确判断它何时完成。
    requires:
      - specs
      - design

  - id: verification
    generates: verification.md
    description: 验证计划与实际执行结果
    template: verification.md
    instruction: |
      创建验证计划，将需求和场景映射到真实、可执行的检查。
      规划阶段保持“待执行”，不得捏造结果。
      命令必须来自仓库中已确认的脚本或工具配置；尚未确认命令时，写明确认方式，不得伪造可执行命令。
      执行阶段仅在实际运行检查并阅读输出后记录“通过”。
      失败、不适用和未执行项必须记录原因与剩余风险。
    requires:
      - tasks

apply:
  requires: [verification]
  tracks: tasks.md
  instruction: |
    阅读上下文文件，逐项完成待办任务，完成后立即勾选。
    执行 verification.md 中适用的检查，并记录真实命令、结果、失败原因与剩余风险。
    遇到阻塞或需要澄清时暂停。
