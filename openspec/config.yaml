# openspec/config.yaml
schema: evidence-driven

# 会注入所有产物，只保留稳定且跨产物通用的约束
context: |
  技术栈：后端为 Java/Spring Boot，前端为 TypeScript/Vue 3。
  前后端使用独立 capability spec；发生契约变更时通过 API 路径、Schema 或版本建立关联。

  事实来源优先级：
  1. 现有代码、构建文件、测试、数据库迁移和 API 定义。
  2. 已批准的 OpenSpec 规格。
  3. 仓库文档、架构决策和相邻模块惯例。
  具体版本、工具、模块边界和命令必须从仓库确认，不得自行假设。

  通用原则：
  - 采用最小、可独立验证的变更，保持向后兼容。
  - 不混入无关重构、依赖升级或格式化修改。
  - 不为未经确认的未来需求设计抽象。
  - 不确定时明确记录假设和待确认问题，不得静默猜测。
  - 每项行为变更必须有可执行验证，测试验证可观察行为而非实现细节。
  - 未实际执行的检查不得声称通过；无法执行时说明原因和剩余风险。
  - API、数据、配置、迁移、类型和文档必须保持同步。

rules:
  proposal:
    - 描述问题、受影响用户、预期结果以及现在进行变更的原因。
    - 定义可衡量的成功指标和明确的非目标。
    - 列出受影响的后端模块、前端功能、API、数据、外部系统和团队。
    - 将变更评估为低、中或高风险，并说明判断依据。
    - 列出已知假设、约束、依赖和待确认问题。
    - 说明兼容性影响、发布策略、回滚策略以及是否需要功能开关。
    - 缺陷修复必须说明实际行为、预期行为、复现条件和业务影响。
    - 除非属于方案约束，否则 proposal 中避免过早描述实现细节。
    - 前后端需求必须拆分为独立 capability spec，不得混写在同一份 spec 中。
    - 涉及前后端契约时，分别列出后端契约能力和前端消费能力，并声明关联方式。

  specs:
    - 使用“必须”“应当”“可以”等明确词语表达要求。
    - 每项需求必须至少包含一个可观察的验收场景。
    - 使用 Given/When/Then 格式描述具体输入、操作和预期结果。
    - 除正常流程外，还应覆盖适用的边界、校验、异常、权限和恢复场景。
    - 适用时覆盖并发、幂等、超时、重试和重复请求场景。
    - API 变更应明确状态码、响应、校验规则和兼容性要求。
    - 前端变更应明确加载、空数据、错误、重试、禁用和无权限状态。
    - 明确描述业务不变量以及系统禁止发生的行为。
    - 除必要的技术约束外，需求不得依赖具体实现方案。
    - 避免使用“快速”“简单”“友好”“健壮”等不可衡量的词语。
    - 每个场景必须能够映射到自动化测试或明确的人工验证步骤。
    - 后端 spec 只描述服务端行为、接口契约、数据和错误语义。
    - 前端 spec 只描述用户行为、页面状态、交互和契约消费方式。
    - 前后端 spec 通过 API 路径、OpenAPI operationId、Schema 名称或明确版本关联，禁止复制两份易漂移的契约定义。

  design:
    - 首先简要描述当前状态和目标状态。
    - 提供影响范围，包括模块、文件或包、API、数据、配置和外部依赖。
    - 说明组件边界、职责、依赖关系以及端到端数据流。
    - 记录备选方案、权衡因素以及选择当前方案的原因。
    - 优先复用仓库现有模式，并引用具有代表性的现有实现。
    - Spring 变更应说明校验、权限、事务、异常、并发和可观测性设计。
    - 数据变更应说明迁移顺序、混合版本兼容、数据回填、锁和回滚。
    - API 变更应说明契约演进、兼容性、错误语义和客户端影响。
    - Vue 变更应说明组件边界、状态归属、路由、运行时校验和界面状态。
    - 说明 Spring DTO 与 TypeScript 类型之间的契约同步方式。
    - 列出重要外部依赖的失败模式以及系统预期行为。
    - 提供需求与单元、集成、契约、组件和端到端测试的对应关系。
    - 定义上线后验证变更所需的日志、指标、链路或告警。
    - 中高风险变更必须描述发布、功能开关、迁移和回滚顺序。
    - 明确列出进入实现前仍需要人工批准的决策。

  tasks:
    - 按依赖顺序排列任务，优先拆分为可独立验证的纵向切片。
    - 每个任务只处理一项行为或一项边界清晰的基础设施变更。
    - 每项实现任务必须关联其对应的需求和验收场景。
    - 每项任务注明影响范围、预期结果、需要新增或修改的测试及验证命令。
    - 对行为变更，应尽可能先编写能够失败的测试。
    - 契约、迁移、后端、前端、集成和发布任务风险不同时应分别拆分。
    - 前后端同时变更时，增加 API 与 TypeScript 类型同步任务。
    - 必须包含异常路径和回归测试，不能只测试正常流程。
    - 禁止使用“实现后端”“添加测试”“更新前端”等模糊任务描述。
    - 不得将无关清理、重构、格式化或依赖升级混入功能任务。
    - 公共 API、数据结构、安全边界或架构发生变化后增加人工审查节点。
    - 增加编译、静态分析、类型检查、定向测试、回归测试和 OpenSpec 校验任务。
    - 必须从仓库确定执行命令，不得自行编造 Maven、Gradle、npm 或 pnpm 命令。
    - 记录实际验证结果，并说明跳过的检查和剩余风险。
    - 后端和前端任务分别关联各自 spec；契约联调作为独立任务并同时引用双方场景。
    - 每个任务应形成可审查的行为增量，避免按 Controller、Service、页面等技术层拆成大型任务。

  verification:
    - 每项验收场景必须关联至少一种自动化测试或明确的人工验证方式。
    - 必须从仓库中确认真实的验证命令，不得自行编造命令。
    - 规划阶段所有检查必须标记为“待执行”，不得虚构执行结果。
    - 实施完成后必须记录实际命令、执行结果、失败原因和跳过原因。
    - 独立验证结论必须由未参与实现的 Agent 在新会话中填写。
    - 独立 Agent 必须重新执行构建、静态或类型检查以及受影响的定向测试，不能只采信实现者记录。
    - 缺陷修复必须包含能够复现原问题的回归测试证据。
    - 中高风险变更必须包含兼容性、安全、发布后观察和回滚验证。
    - 无法执行的检查必须说明原因、影响、补偿措施和剩余风险。